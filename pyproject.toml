[project]
name = "rag-with-receipts"
version = "0.1.0"
description = "Grounded, cited, latency-instrumented RAG over the OSRS Wiki"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
ingest = [
    "beautifulsoup4",
    "lxml",
    "httpx",
    "transformers",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
    "tqdm",
]
index = [
    "sentence-transformers",
    "faiss-cpu",
]
serve = [
    "fastapi",
    "uvicorn",
    "anthropic",
]
eval = [
    "anthropic",
    "tqdm",
]
generation = [
    "anthropic",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load a real ML model or make a real external API call (e.g. bge-large-en-v1.5, Anthropic API); excluded by default",
]
addopts = '-m "not slow"'
