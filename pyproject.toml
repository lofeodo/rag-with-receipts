[project]
name = "rag-with-receipts"
version = "0.1.0"
description = "Grounded, cited, latency-instrumented RAG over the OSRS Wiki"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
ingest = [
    "beautifulsoup4",
    "lxml",
    "httpx",
    "transformers",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
    "tqdm",
]
index = [
    "sentence-transformers",
    "faiss-cpu",
    "pandas",   # index_metadata.parquet read/write (indexing/output.py, retrieval/pipeline.py)
    "pyarrow",  # parquet engine for pandas
]
serve = [
    "fastapi",
    "uvicorn",
    "anthropic",
    "pyyaml",  # rag_receipts.config.load_config
]
gcp = [
    "google-cloud-storage",
]
eval = [
    "anthropic",
    "tqdm",
]
generation = [
    "anthropic",
]
dev = [
    "pytest",
    "ruff",
    "httpx",  # required by fastapi.testclient.TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load a real ML model or make a real external API call (e.g. bge-large-en-v1.5, Anthropic API); excluded by default",
]
addopts = '-m "not slow"'
