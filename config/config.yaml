# RAG With Receipts — pipeline configuration
# Filled in incrementally as each step is implemented. Unimplemented sections are
# stubbed with the locked decision so intent is visible ahead of the code.

corpus:
  source: osrs_wiki
  api_base: https://oldschool.runescape.wiki/api.php
  license: CC BY-NC-SA 3.0
  user_agent: "rag-with-receipts/0.1 (portfolio project; contact: daniel.lofeodo@gmail.com)"

ingestion:
  categories:
    - label: combat_mechanics
      category: "Category:Combat"
    - label: slayer_training
      pages: ["Slayer training"]
    - label: herblore_training
      pages: ["Herblore training"]
  questline:
    label: questline
    pages:
      - "Monkey Madness I"
      - "Monkey Madness I/Quick guide"
  link_follow:
    depth: 1
    target_categories:
      - "Category:Items"
      - "Category:Monsters"
  output:
    raw_dir: data/raw
    processed_dir: data/processed
    results_dir: results
  chunking:
    tokenizer: BAAI/bge-large-en-v1.5
    target_tokens: 380
    max_tokens: 450
    min_tokens: 80
    overlap_tokens: 60
  fetch:
    rate_limit_delay_seconds: 0.5
    max_retries: 3

indexing:
  embedding_model: BAAI/bge-large-en-v1.5   # local, sentence-transformers
  vector_index: faiss                       # flat index, file artifact
  batch_size: 32
  normalize_embeddings: true
  device: auto                              # auto | cpu | cuda; auto = torch.cuda.is_available()
  show_progress_bar: true
  query_instruction: "Represent this sentence for searching relevant passages: "
  output:
    index_dir: data/index
    index_filename: faiss.index
    metadata_filename: index_metadata.parquet
    stats_path: data/processed/index_stats.json

retrieval:
  top_k_dense: 30
  top_k_final: 5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2  # Step 7 sweep: Pareto-dominates
  # the prior default (BAAI/bge-reranker-base) on this corpus - higher recall/hit-rate/MRR
  # AND ~4x faster. See CLAUDE.md Step 7 status note for the full comparison.
  reranker_batch_size: 32
  reranker_device: auto
  reranker_show_progress_bar: false

generation:
  provider: anthropic
  model: claude-sonnet-5                    # config-driven, not hardcoded
  max_tokens: 4096

eval:
  judge_model: claude-sonnet-5              # config-driven, not hardcoded
  judge_max_tokens: 1024
  dataset_path: data/eval/qa_pairs.json
  output_path: results/eval_report.json

grounding:
  nli_model: cross-encoder/nli-deberta-v3-base   # local, sentence-transformers CrossEncoder
  nli_device: auto                               # auto | cpu | cuda
  nli_batch_size: 32
  nli_show_progress_bar: false
  entailment_threshold: 0.5
  contradiction_threshold: 0.5
  overlap_threshold: 0.3

vertex:
  # Stretch goal: Vertex AI Search benchmark comparison. Data store provisioned
  # 2026-10-02 in the rag-with-receipts project (northamerica-northeast1 GCS bucket,
  # global Discovery Engine data store/engine) - see CLAUDE.md status note.
  project_id: rag-with-receipts
  location: global                          # verify at provisioning time - Answer API may be global-only
  data_store_id: rag-receipts-corpus
  engine_id: rag-receipts-search-app        # config B (Answer API) only
  search_serving_config: default_search
  answer_serving_config: default_serving_config  # verify exact id at provisioning time
  search_top_k: 10                          # no local rerank stage, so > top_k_final=5
  gcs_bucket: rag-with-receipts-vertex-corpus
  gcs_prefix: corpus
  search_results_path: results/vertex_search_eval.json
  answer_results_path: results/vertex_answer_eval.json
