<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG With Receipts</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --accent-dim: #3a5bb8;
    --warn: #e0a93e;
    --error: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.35rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.75rem; }
  input[type=text] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.1rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { background: var(--accent-dim); cursor: wait; }
  #status { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.1em; }
  #status.error { color: var(--error); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .answer { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    margin-bottom: 0.6rem;
  }
  .badge.answerable { background: #1f3a2a; color: #6fcf8f; }
  .badge.not-answerable { background: #3a2e1f; color: var(--warn); }
  .citations { margin-top: 0.4rem; }
  .citations h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 1.2rem 0 0.5rem; }
  .citation { padding: 0.55rem 0; border-top: 1px solid var(--border); font-size: 0.88rem; }
  .citation:first-child { border-top: none; }
  .citation a { color: var(--accent); text-decoration: none; }
  .citation a:hover { text-decoration: underline; }
  .citation .claim { color: var(--muted); margin-top: 0.2rem; }
  .hallucination-warning {
    margin-top: 0.75rem;
    font-size: 0.82rem;
    color: var(--error);
  }
  .timing { color: var(--muted); font-size: 0.78rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>RAG With Receipts</h1>
    <div class="subtitle">
      Grounded, cited answers over a scoped slice of the Old School RuneScape Wiki.
      Every claim below cites the exact retrieved chunk it came from.
    </div>
  </header>

  <form id="query-form">
    <input id="query-input" type="text" autocomplete="off"
           placeholder="e.g. What items are required to start Monkey Madness I?" />
    <button id="submit-btn" type="submit">Ask</button>
  </form>

  <div id="status"></div>
  <div id="result"></div>
</main>

<script>
  const form = document.getElementById('query-form');
  const input = document.getElementById('query-input');
  const button = document.getElementById('submit-btn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTiming(t) {
    const ms = (s) => Math.round(s * 1000);
    return `retrieval ${ms(t.embed_query_s + t.dense_search_s + t.rerank_s)}ms `
         + `&middot; generation ${ms(t.generate_s)}ms &middot; total ${ms(t.total_s)}ms`;
  }

  function render(data) {
    const badgeClass = data.answerable ? 'answerable' : 'not-answerable';
    const badgeText = data.answerable ? 'Answerable from corpus' : 'Not answerable from corpus';

    let citationsHtml = '';
    if (data.citations.length > 0) {
      citationsHtml = '<div class="citations"><h2>Citations</h2>' +
        data.citations.map(c => `
          <div class="citation">
            <a href="${escapeHtml(c.url)}#${escapeHtml(c.heading_anchor)}" target="_blank" rel="noopener">
              ${escapeHtml(c.page_title)} &rsaquo; ${escapeHtml(c.section_path)}
            </a>
            <div class="claim">${escapeHtml(c.claim)}</div>
          </div>
        `).join('') + '</div>';
    }

    let warningHtml = '';
    if (data.hallucinated_citation_ids.length > 0) {
      warningHtml = `<div class="hallucination-warning">
        ${data.hallucinated_citation_ids.length} citation(s) referenced a chunk not in the
        retrieved set and were dropped.
      </div>`;
    }

    result.innerHTML = `
      <div class="card">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <div class="answer">${escapeHtml(data.answer)}</div>
        ${citationsHtml}
        ${warningHtml}
        <div class="timing">${renderTiming(data.timing)}</div>
      </div>
    `;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    button.disabled = true;
    status.textContent = 'Retrieving and generating…';
    status.classList.remove('error');
    result.innerHTML = '';

    try {
      const resp = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${resp.status})`);
      }

      const data = await resp.json();
      status.textContent = '';
      render(data);
    } catch (err) {
      status.textContent = err.message || 'Something went wrong.';
      status.classList.add('error');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
