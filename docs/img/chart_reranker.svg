<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The adopted reranker beat the old default on accuracy and speed"><rect x="0.5" y="0.5" width="719" height="423" rx="14" fill="#ffffff" stroke="#e3e6ec"/><text x="28" y="40" font-size="18" font-weight="700" fill="#1f2430">The adopted reranker beat the old default on accuracy and speed</text><text x="28" y="60" font-size="13" fill="#6b7280">Three rerankers compared on the same 55-question gold set</text><text x="28" y="96" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">RETRIEVAL HIT RATE (HIGHER IS BETTER)</text><text x="28" y="134" font-size="14" font-weight="500" fill="#1f2430">bge-base (old default)</text><rect x="218" y="118" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="118" width="360.0" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="134" font-size="14" font-weight="700" fill="#1f2430">90%</text><text x="28" y="174" font-size="14" font-weight="500" fill="#1f2430">bge-v2-m3</text><rect x="218" y="158" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="158" width="392.0" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="174" font-size="14" font-weight="700" fill="#1f2430">98%</text><text x="28" y="214" font-size="14" font-weight="700" fill="#1f2430">MiniLM (adopted)</text><rect x="218" y="198" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="198" width="384.0" height="22" rx="6" fill="#6d5bd0"/><text x="628" y="214" font-size="14" font-weight="700" fill="#1f2430">96%</text><text x="28" y="260" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">RERANK LATENCY, P50 (LOWER IS BETTER)</text><text x="28" y="298" font-size="14" font-weight="500" fill="#1f2430">bge-base (old default)</text><rect x="218" y="282" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="282" width="73.6" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="298" font-size="14" font-weight="700" fill="#1f2430">552 ms</text><text x="28" y="338" font-size="14" font-weight="500" fill="#1f2430">bge-v2-m3</text><rect x="218" y="322" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="322" width="370.0" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="338" font-size="14" font-weight="700" fill="#1f2430">2,775 ms</text><text x="28" y="378" font-size="14" font-weight="700" fill="#1f2430">MiniLM (adopted)</text><rect x="218" y="362" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="362" width="14.8" height="22" rx="6" fill="#6d5bd0"/><text x="628" y="378" font-size="14" font-weight="700" fill="#1f2430">111 ms</text></svg>