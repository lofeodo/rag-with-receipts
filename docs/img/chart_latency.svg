<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The LLM call is the bottleneck, not retrieval"><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="#ffffff" stroke="#e3e6ec"/><text x="28" y="40" font-size="18" font-weight="700" fill="#1f2430">The LLM call is the bottleneck, not retrieval</text><text x="28" y="60" font-size="13" fill="#6b7280">Per-stage latency, p50, measured on the real pipeline</text><text x="28" y="96" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">MEDIAN TIME PER STAGE</text><text x="28" y="134" font-size="14" font-weight="500" fill="#1f2430">Embed query</text><rect x="218" y="118" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="118" width="10.6" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="134" font-size="14" font-weight="700" fill="#1f2430">80 ms</text><text x="28" y="174" font-size="14" font-weight="500" fill="#1f2430">Vector search</text><rect x="218" y="158" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="158" width="3.0" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="174" font-size="14" font-weight="700" fill="#1f2430">0.3 ms</text><text x="28" y="214" font-size="14" font-weight="500" fill="#1f2430">Rerank</text><rect x="218" y="198" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="198" width="36.7" height="22" rx="6" fill="#c9cdd6"/><text x="628" y="214" font-size="14" font-weight="700" fill="#1f2430">276 ms</text><text x="28" y="254" font-size="14" font-weight="700" fill="#1f2430">LLM generation</text><rect x="218" y="238" width="400" height="22" rx="6" fill="#eef0f4"/><rect x="218" y="238" width="389.0" height="22" rx="6" fill="#6d5bd0"/><text x="628" y="254" font-size="14" font-weight="700" fill="#1f2430">2,918 ms</text></svg>