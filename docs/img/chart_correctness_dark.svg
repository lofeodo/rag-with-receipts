<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Single-hop is solved; multi-hop is the open problem"><rect x="0.5" y="0.5" width="719" height="259" rx="14" fill="#161b22" stroke="#30363d"/><text x="28" y="40" font-size="18" font-weight="700" fill="#e6edf3">Single-hop is solved; multi-hop is the open problem</text><text x="28" y="60" font-size="13" fill="#8b949e">Share of answers judged correct, by question type</text><text x="28" y="96" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="0.4">ANSWER CORRECTNESS (LLM JUDGE)</text><text x="28" y="134" font-size="14" font-weight="700" fill="#e6edf3">Single-hop (n=35)</text><rect x="218" y="118" width="400" height="22" rx="6" fill="#21262d"/><rect x="218" y="118" width="400.0" height="22" rx="6" fill="#8b7df0"/><text x="628" y="134" font-size="14" font-weight="700" fill="#e6edf3">100%</text><text x="28" y="174" font-size="14" font-weight="500" fill="#e6edf3">Multi-hop (n=15)</text><rect x="218" y="158" width="400" height="22" rx="6" fill="#21262d"/><rect x="218" y="158" width="186.7" height="22" rx="6" fill="#3d444d"/><text x="628" y="174" font-size="14" font-weight="700" fill="#e6edf3">47%</text><text x="28" y="214" font-size="14" font-weight="500" fill="#e6edf3">Overall (n=55)</text><rect x="218" y="198" width="400" height="22" rx="6" fill="#21262d"/><rect x="218" y="198" width="334.5" height="22" rx="6" fill="#3d444d"/><text x="628" y="214" font-size="14" font-weight="700" fill="#e6edf3">84%</text></svg>